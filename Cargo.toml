[package]
name = "stremflix-rs"
version = "0.1.0"
edition = "2024"
# eframe/egui 0.37 need 1.95; notify-rust 4.18 needs 1.89.
rust-version = "1.95"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23"
# glow (OpenGL) instead of the default wgpu: libmpv renders through OpenGL into our framebuffer.
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "system_fonts", "wayland", "x11"] }
egui_extras = { version = "0.37", features = ["image"] }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
keepawake = "0.6"
libloading = "0.8"
librqbit = { version = "9.1.0", features = ["http-api", "tracing-subscriber-utils"] }
librqbit-dualstack-sockets = "0.7.0"
percent-encoding = "2.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "socks"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
rusty-leveldb = "4"
serde = { version = "1.0.229", features = ["derive"] }
# OS media keys and now-playing (MPRIS / SMTC / MPNowPlaying); zbus (pure Rust, already in the tree) avoids libdbus.
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
url = "2.5.8"
walkdir = "2.5.0"
qrcode = { version = "0.14", default-features = false }
notify-rust = { version = "4.18.2", default-features = false, features = ["z"] }

# Windows media controls (SMTC) need the window's HWND.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

# macOS delivers stremio:// links as Apple events: the app runs winit's loop itself to hook them.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
winit = { version = "0.30.13", default-features = false }

# Tray: StatusNotifierItem over D-Bus, on the async-io zbus accesskit already uses (no GTK, unlike tray-icon there).
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["async-io"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
test-addon = { path = "test-addon" }

# smaller debug info: faster linking and smaller target dir; backtraces keep file:line (CARGO_PROFILE_DEV_DEBUG=true for a debugger)
[profile.dev]
debug = "line-tables-only"

[workspace]
members = ["test-addon"]
