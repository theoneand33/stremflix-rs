name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.2.3 (tagged as v1.2.3)"
        required: true
  schedule:
    - cron: "0 */3 * * *" # nightly build every 3 hours

permissions:
  contents: write

env:
  TAG: ${{ inputs.version && format('v{0}', inputs.version) || 'nightly' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/$GITHUB_REPOSITORY/commits/nightly" --jq .sha 2>/dev/null || true)
          echo "changed=$([ "$last" = "$GITHUB_SHA" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    # skip scheduled nightlies when main has no new commits since the last one
    if: github.event_name != 'schedule' || needs.changes.outputs.changed == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: macos-15
            target: macos-arm64
          - os: windows-2025
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Validate version
        if: inputs.version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "invalid version: $VERSION"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libmpv (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libmpv-dev
      - name: Install libmpv (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install mpv
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install libmpv (Windows)
        if: runner.os == 'Windows'
        env:
          # pinned build + checksum; bump both together from https://github.com/shinchiro/mpv-winbuild-cmake/releases
          MPV_URL: https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261101/mpv-dev-x86_64-20261101-git-48fca90e8c.7z
          MPV_SHA256: 30d3f9fa121ce24638610a9ae52f8957743f9dea416dd37dc4ff7e43589ef843
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "$env:RUNNER_TEMP\mpv"
          curl.exe -fsSL --retry 3 -o "$env:RUNNER_TEMP\mpv-dev.7z" $env:MPV_URL
          if ((Get-FileHash "$env:RUNNER_TEMP\mpv-dev.7z" -Algorithm SHA256).Hash -ne $env:MPV_SHA256) { throw "mpv-dev checksum mismatch" }
          7z x "$env:RUNNER_TEMP\mpv-dev.7z" "-o$dir" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z failed" }
          # the archive ships only a MinGW import lib (libmpv.dll.a); build mpv.lib for MSVC from the DLL's exports
          $names = dumpbin /nologo /exports "$dir\libmpv-2.dll" | ForEach-Object { if ($_ -match '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]{8}\s+(mpv_\w+)') { $Matches[1] } }
          if (-not $names) { throw "no mpv_ exports found" }
          Set-Content "$dir\mpv.def" (@('LIBRARY libmpv-2.dll', 'EXPORTS') + $names)
          lib /nologo /machine:x64 /def:"$dir\mpv.def" /out:"$dir\mpv.lib"
          if ($LASTEXITCODE -ne 0) { throw "lib.exe failed" }
          "RUSTFLAGS=-L native=$dir" >> $env:GITHUB_ENV
          "MPV_DIR=$($dir.Replace('\', '/'))" >> $env:GITHUB_ENV # forward slashes for the bash Package step
      - run: cargo build --release --locked --bin stremio-lite
      - name: Package
        shell: bash
        env:
          NAME: stremio-lite-${{ env.TAG }}-${{ matrix.target }}
        run: |
          mkdir "$NAME"
          if [ "$RUNNER_OS" = Windows ]; then
            # the exe imports libmpv-2.dll by that exact name, so ship it unrenamed next to the exe
            cp target/release/stremio-lite.exe "$MPV_DIR/libmpv-2.dll" README.md "$NAME/"
            7z a -tzip "$NAME.zip" "$NAME" > /dev/null
          else
            cp target/release/stremio-lite README.md "$NAME/"
            tar czf "$NAME.tar.gz" "$NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$TAG" = nightly ]; then
            gh release delete nightly --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
            gh release create nightly *.tar.gz *.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Nightly ($(date -u +%F' '%H:%M) UTC, ${GITHUB_SHA::7})" --notes "Automated build of $GITHUB_SHA." --prerelease
          else
            gh release create "$TAG" *.tar.gz *.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$TAG" --generate-notes
          fi
