name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.2.3 (tagged as v1.2.3)"
        required: true
  schedule:
    - cron: "0 */3 * * *" # nightly build every 3 hours

permissions:
  contents: write

env:
  TAG: ${{ inputs.version && format('v{0}', inputs.version) || 'nightly' }}
  # lld-link is much faster than MSVC link.exe; only read when targeting Windows MSVC
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/$GITHUB_REPOSITORY/commits/nightly" --jq .sha 2>/dev/null || true)
          echo "changed=$([ "$last" = "$GITHUB_SHA" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    # skip scheduled nightlies when main has no new commits since the last one
    if: github.event_name != 'schedule' || needs.changes.outputs.changed == 'true'
    strategy:
      matrix:
        include:
          # linuxdeploy: arch and sha256 of the pinned linuxdeploy build (see LINUXDEPLOY_URL)
          - os: ubuntu-24.04
            target: linux-x86_64
            linuxdeploy: x86_64
            linuxdeploy_sha256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
          - os: ubuntu-24.04-arm
            target: linux-arm64
            linuxdeploy: aarch64
            linuxdeploy_sha256: 620095110d693282b8ebeb244a95b5e911cf8f65f76c88b4b47d16ae6346fcff
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x86_64
          - os: windows-2025
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Validate version
        if: inputs.version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "invalid version: $VERSION"; exit 1; }'
      - uses: actions/checkout@v7
      - uses: samypr100/setup-dev-drive@v4
        if: runner.os == 'Windows'
        with:
          # ReFS dev drive mounted as ./target; NTFS + Defender made cache restore and cargo's fingerprint scan ~2x slower
          drive-size: 10GB
          mount-path: target
          trusted-dev-drive: true
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libmpv (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libmpv-dev
      - name: Resolve libmpv (macOS)
        id: brew-mpv
        if: runner.os == 'macOS'
        run: |
          # cache only what brew would install (mpv + deps missing from the image); pouring ~38 bottles costs ~1.5 min
          prefix=$(brew --prefix)
          installed=$(brew list --formula -1)
          {
            echo "key=brew-mpv-$ImageOS-$ImageVersion-$(brew info --json=v2 mpv | jq -r '.formulae[0] | "\(.versions.stable)_\(.revision)"')"
            echo 'paths<<EOF'
            for f in mpv $(brew deps mpv); do grep -qx "$f" <<<"$installed" || printf '%s\n' "$prefix/Cellar/$f" "$prefix/opt/$f"; done
            echo EOF
          } >> "$GITHUB_OUTPUT"
          echo "LIBRARY_PATH=$prefix/opt/mpv/lib" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        id: brew-cache
        if: runner.os == 'macOS'
        with:
          path: ${{ steps.brew-mpv.outputs.paths }}
          key: ${{ steps.brew-mpv.outputs.key }}
      - name: Install libmpv (macOS)
        if: runner.os == 'macOS' && steps.brew-cache.outputs.cache-hit != 'true'
        run: brew install mpv
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install libmpv (Windows)
        if: runner.os == 'Windows'
        env:
          # pinned build + checksum; bump both together from https://github.com/shinchiro/mpv-winbuild-cmake/releases
          MPV_URL: https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261101/mpv-dev-x86_64-20261101-git-48fca90e8c.7z
          MPV_SHA256: 30d3f9fa121ce24638610a9ae52f8957743f9dea416dd37dc4ff7e43589ef843
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "$env:RUNNER_TEMP\mpv"
          curl.exe -fsSL --retry 3 -o "$env:RUNNER_TEMP\mpv-dev.7z" $env:MPV_URL
          if ((Get-FileHash "$env:RUNNER_TEMP\mpv-dev.7z" -Algorithm SHA256).Hash -ne $env:MPV_SHA256) { throw "mpv-dev checksum mismatch" }
          7z x "$env:RUNNER_TEMP\mpv-dev.7z" "-o$dir" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z failed" }
          # the archive ships only a MinGW import lib (libmpv.dll.a); build mpv.lib for MSVC from the DLL's exports
          $names = dumpbin /nologo /exports "$dir\libmpv-2.dll" | ForEach-Object { if ($_ -match '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]{8}\s+(mpv_\w+)') { $Matches[1] } }
          if (-not $names) { throw "no mpv_ exports found" }
          Set-Content "$dir\mpv.def" (@('LIBRARY libmpv-2.dll', 'EXPORTS') + $names)
          lib /nologo /machine:x64 /def:"$dir\mpv.def" /out:"$dir\mpv.lib"
          if ($LASTEXITCODE -ne 0) { throw "lib.exe failed" }
          "RUSTFLAGS=-L native=$dir" >> $env:GITHUB_ENV
          "MPV_DIR=$($dir.Replace('\', '/'))" >> $env:GITHUB_ENV # forward slashes for the bash Package step
      - run: cargo build --release --locked --bin stremflix-rs
      - name: Package
        shell: bash
        env:
          NAME: stremflix-rs-${{ env.TAG }}-${{ matrix.target }}
        run: |
          mkdir "$NAME"
          if [ "$RUNNER_OS" = Windows ]; then
            # the exe imports libmpv-2.dll by that exact name, so ship it unrenamed next to the exe
            cp target/release/stremflix-rs.exe "$MPV_DIR/libmpv-2.dll" README.md "$NAME/"
            7z a -tzip "$NAME.zip" "$NAME" > /dev/null
          else
            cp target/release/stremflix-rs README.md "$NAME/"
            tar czf "$NAME.tar.gz" "$NAME"
          fi
      - name: Package AppImage (Linux)
        if: runner.os == 'Linux'
        env:
          # pinned build; bump it together with both matrix checksums from https://github.com/linuxdeploy/linuxdeploy/releases
          LINUXDEPLOY_URL: https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-${{ matrix.linuxdeploy }}.AppImage
          LINUXDEPLOY_SHA256: ${{ matrix.linuxdeploy_sha256 }}
          APPIMAGE_EXTRACT_AND_RUN: "1" # runners have no FUSE
          LDAI_OUTPUT: stremflix-rs-${{ env.TAG }}-${{ matrix.target }}.AppImage
          # embedded so AppImageUpdate can find new builds; nightly is a prerelease, so "latest" would skip it
          LDAI_UPDATE_INFORMATION: gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|${{ inputs.version && 'latest' || 'nightly' }}|stremflix-rs-*-${{ matrix.target }}.AppImage.zsync
        run: |
          ld="$RUNNER_TEMP/linuxdeploy"
          curl -fsSL --retry 3 -o "$ld" "$LINUXDEPLOY_URL"
          echo "$LINUXDEPLOY_SHA256  $ld" | sha256sum -c -
          chmod +x "$ld"
          printf '%s\n' '[Desktop Entry]' Type=Application Name=Stremflix-rs Exec=stremflix-rs Icon=stremflix-rs Categories=AudioVideo\;Video\;Player\; > "$RUNNER_TEMP/stremflix-rs.desktop"
          cp assets/icon.png "$RUNNER_TEMP/stremflix-rs.png"
          # bundles libmpv and its deps; glibc, GL and other host libs stay on the excludelist
          "$ld" --appdir AppDir -e target/release/stremflix-rs -d "$RUNNER_TEMP/stremflix-rs.desktop" -i "$RUNNER_TEMP/stremflix-rs.png" --output appimage
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
            *.AppImage
            *.AppImage.zsync
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$TAG" = nightly ]; then
            gh release delete nightly --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
            gh release create nightly *.tar.gz *.zip *.AppImage *.AppImage.zsync --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Nightly ($(date -u +%F' '%H:%M) UTC, ${GITHUB_SHA::7})" --notes "Automated build of $GITHUB_SHA." --prerelease
          else
            gh release create "$TAG" *.tar.gz *.zip *.AppImage *.AppImage.zsync --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$TAG" --generate-notes
          fi
