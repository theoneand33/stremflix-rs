name: Check

on:
  push:
    branches: [main] # PRs are covered by pull_request; avoids running twice per PR push
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      STREMIO_LITE_NO_DHT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # only main saves: PR caches can't be shared and push the repo past the 10 GB cap, evicting the release caches
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install libmpv (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libmpv-dev
      - name: Resolve libmpv (macOS)
        id: brew-mpv
        if: runner.os == 'macOS'
        run: |
          # cache only what brew would install (mpv + deps missing from the image); pouring ~38 bottles costs ~1.5 min
          prefix=$(brew --prefix)
          installed=$(brew list --formula -1)
          {
            echo "key=brew-mpv-$ImageOS-$ImageVersion-$(brew info --json=v2 mpv | jq -r '.formulae[0] | "\(.versions.stable)_\(.revision)"')"
            echo 'paths<<EOF'
            for f in mpv $(brew deps mpv); do grep -qx "$f" <<<"$installed" || printf '%s\n' "$prefix/Cellar/$f" "$prefix/opt/$f"; done
            echo EOF
          } >> "$GITHUB_OUTPUT"
          echo "LIBRARY_PATH=$prefix/opt/mpv/lib" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        id: brew-cache
        if: runner.os == 'macOS'
        with:
          path: ${{ steps.brew-mpv.outputs.paths }}
          key: ${{ steps.brew-mpv.outputs.key }}
      - name: Install libmpv (macOS)
        if: runner.os == 'macOS' && steps.brew-cache.outputs.cache-hit != 'true'
        run: brew install mpv
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install libmpv (Windows)
        if: runner.os == 'Windows'
        env:
          # pinned build + checksum (same as release.yml); bump both together from https://github.com/shinchiro/mpv-winbuild-cmake/releases
          MPV_URL: https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261101/mpv-dev-x86_64-20261101-git-48fca90e8c.7z
          MPV_SHA256: 30d3f9fa121ce24638610a9ae52f8957743f9dea416dd37dc4ff7e43589ef843
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "$env:RUNNER_TEMP\mpv"
          curl.exe -fsSL --retry 3 -o "$env:RUNNER_TEMP\mpv-dev.7z" $env:MPV_URL
          if ((Get-FileHash "$env:RUNNER_TEMP\mpv-dev.7z" -Algorithm SHA256).Hash -ne $env:MPV_SHA256) { throw "mpv-dev checksum mismatch" }
          7z x "$env:RUNNER_TEMP\mpv-dev.7z" "-o$dir" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z failed" }
          # the archive ships only a MinGW import lib (libmpv.dll.a); build mpv.lib for MSVC from the DLL's exports
          $names = dumpbin /nologo /exports "$dir\libmpv-2.dll" | ForEach-Object { if ($_ -match '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]{8}\s+(mpv_\w+)') { $Matches[1] } }
          if (-not $names) { throw "no mpv_ exports found" }
          Set-Content "$dir\mpv.def" (@('LIBRARY libmpv-2.dll', 'EXPORTS') + $names)
          lib /nologo /machine:x64 /def:"$dir\mpv.def" /out:"$dir\mpv.lib"
          if ($LASTEXITCODE -ne 0) { throw "lib.exe failed" }
          "RUSTFLAGS=-L native=$dir" >> $env:GITHUB_ENV
          $dir >> $env:GITHUB_PATH # tests load libmpv-2.dll at runtime
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked
