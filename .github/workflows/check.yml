name: Check

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      STREMIO_LITE_NO_DHT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libmpv (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libmpv-dev
      - name: Install libmpv (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install mpv
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked
