name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths-ignore:
      - "**.md"
      - "public/images/**"
      - "public/flash/**"
      - "Cargo.lock"

jobs:
  opencode-review:
    # Job-level so a skipped draft run cannot cancel an in-flight review.
    concurrency:
      group: opencode-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # Fork PRs get no secrets, so the review would only fail.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # check.yml already builds/tests on 3 OSes; cold cargo runs here cost 1.5-3.5 min per review
          OPENCODE_CONFIG_CONTENT: '{"instructions":[".github/opencode-review.md"],"permission":{"*":"allow","edit":"deny","write":"deny","webfetch":"deny","websearch":"deny","task":"deny","bash":{"*":"allow","cargo *":"deny","*=* cargo *":"deny"}}}'
        with:
          model: openrouter/deepseek/deepseek-v4.1-flash-1017
